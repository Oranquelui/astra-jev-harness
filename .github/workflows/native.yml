name: Native compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: go test ./...
      - run: go build -trimpath -o "$RUNNER_TEMP/astra-jev-core" ./cmd/astra-jev-core
      # Correctness only: default samples=0; no timing or provider calls in CI.
      - run: python scripts/compare_native.py --binary "$RUNNER_TEMP/astra-jev-core" --out "$RUNNER_TEMP/native-compatibility.json"
